<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"> <!-- no zoom (by request) -->
  <title>Expenses</title>
  <meta name="theme-color" content="#4fb89c">
  <meta name="color-scheme" content="dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes"> <!-- older iPhones still read this one -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Expenses">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Login -->
  <section id="login" class="screen" hidden>
    <form id="login-form" class="login-card">
      <img src="icons/icon-192.png" alt="" width="72" height="72">
      <h1>Expenses</h1>
      <label>Name <input id="login-name" autocomplete="username" autocapitalize="none" required></label>
      <label>Password <input id="login-pass" type="password" autocomplete="current-password" required></label>
      <button type="submit" class="primary">Sign in</button>
      <p id="login-error" class="error" role="alert"></p>
      <img class="maker" src="icons/nova.png" alt="Nova Embedded Solutions" width="96" height="96" loading="lazy">
    </form>
  </section>

  <!-- Main app -->
  <section id="app" class="screen" hidden>
    <header class="topbar">
      <h1 id="page-title">Add expenses</h1>
      <button id="kitty-pill" type="button" class="pill kitty-pill" title="Jop's kitty" aria-label="Jop's kitty balance"></button>
      <span id="net-status" class="net-dot" role="status"></span>
      <button id="menu-btn" class="icon-btn" aria-label="Menu">&#8942;</button>
    </header>
    <div id="menu" class="menu" hidden>
      <p class="menu-user">Signed in as <b id="user-name"></b></p>
      <button data-action="transfer" hidden>Transfer to kitty</button>
      <button data-action="budgets" hidden>Edit budgets</button>
      <button data-action="import">Import history (paste from Excel)</button>
      <button data-action="refresh">Refresh from server</button>
      <button data-action="update">Update app</button>
      <button data-action="logout">Sign out</button>
      <img class="maker" src="icons/nova.png" alt="Nova Embedded Solutions" width="96" height="96" loading="lazy">
      <p class="menu-ver">Version <span id="app-ver">…</span></p>
    </div>

    <div id="outbox-banner" class="banner" hidden></div>

    <main>
      <!-- Add -->
      <div id="page-add" class="page">
        <div id="entry" class="line">
          <div class="entry-grid">
            <input type="month" class="l-month" name="month" aria-label="Month" required>
            <button type="button" class="l-type type-btn" data-type="expense" aria-pressed="false" aria-label="Expense or income (tap to switch)">Expense</button>
            <input type="text" inputmode="decimal" class="l-amount" name="amount" placeholder="Amount" aria-label="Amount">
            <select class="l-cur" name="currency" aria-label="Currency"><option>THB</option></select>
            <label class="l-kitty kitty-tick" title="Comes off / adds to Jop's kitty"><input type="checkbox" class="l-kittybox" name="kitty"><span>Kitty</span></label>
          </div>
          <p class="l-fx" hidden></p>
          <select class="l-cat" name="category" aria-label="Category"></select>
          <input type="text" class="l-comment" name="comment" placeholder="Comment / detail" aria-label="Comment">
        </div>
        <div class="actions">
          <button id="add-line" type="button">+ New line</button>
          <button id="upload" type="button" class="primary">Upload expenses</button>
        </div>
        <p id="add-msg" class="msg" role="status"></p>
        <p id="staged-head" class="staged-head" hidden></p>
        <div id="staged"></div>
      </div>

      <!-- History -->
      <div id="page-history" class="page" hidden>
        <p id="history-info" class="muted small"></p>
        <div id="history-list"></div>
      </div>

      <!-- Filter -->
      <div id="page-filter" class="page" hidden>
        <div class="filters">
          <label>Category
            <select id="f-cat"><option value="">All categories</option></select>
          </label>
          <label>Month
            <select id="f-month"><option value="">All months</option></select>
          </label>
        </div>
        <div class="filter-summary">
          <span id="f-summary"></span>
          <button id="f-copy" type="button" class="small-btn" title="Copy the filtered rows to paste into Excel">Copy</button>
        </div>
        <div id="f-list"></div>
        <p id="f-more" class="muted small" hidden></p>
      </div>

      <!-- Budget -->
      <div id="page-budget" class="page" hidden>
        <div class="b-nav">
          <button id="b-prev" type="button" class="icon-btn" aria-label="Previous month">&#8249;</button>
          <h2 id="b-month"></h2>
          <button id="b-next" type="button" class="icon-btn" aria-label="Next month">&#8250;</button>
        </div>
        <div id="b-total" class="b-total"></div>
        <div id="b-list"></div>
        <div id="b-other"></div>
      </div>

      <!-- Edit budgets (nigel only) -->
      <div id="page-budgets" class="page" hidden>
        <p id="be-info" class="small" role="status"></p>
        <div id="be-list"></div>
      </div>

      <!-- Jop's kitty -->
      <div id="page-kitty" class="page" hidden>
        <div class="k-head">
          <div id="k-bal" class="k-bal"></div>
          <div id="k-sub" class="k-sub"></div>
          <button id="k-transfer" type="button" class="primary" hidden>Transfer to kitty</button>
        </div>
        <h3 class="k-title">Statement</h3>
        <div id="k-list" class="k-list"></div>
      </div>

      <!-- One category in one month (from the Budget tab) -->
      <div id="page-catmonth" class="page" hidden>
        <button type="button" id="cm-back" class="be-back">‹ Budget</button>
        <div class="cm-head"><span id="cm-month"></span><span id="cm-total"></span></div>
        <div id="cm-list" class="cm-list"></div>
      </div>

      <!-- Import -->
      <div id="page-import" class="page" hidden>
        <p class="small">Paste rows copied from Excel with the columns
          <b>Date</b>, <b>Category</b>, <b>Amount</b>, <b>Comment</b> (a header row is ignored).</p>
        <textarea id="imp-text" rows="8" placeholder="1 Nov 26&#9;Groceries (food)&#9;54.20&#9;Tesco"></textarea>
        <div class="actions">
          <button id="imp-check" type="button">Check</button>
          <button id="imp-go" type="button" class="primary" disabled>Upload rows</button>
        </div>
        <div id="imp-result" class="small"></div>
      </div>
    </main>

    <nav class="tabs">
      <button data-page="add" class="active">Add</button>
      <button data-page="history">History</button>
      <button data-page="budget">Budget</button>
      <button data-page="filter">Filter</button>
    </nav>
  </section>

  <dialog id="kitty-dlg" aria-labelledby="t-title">
    <h2 id="t-title">Transfer to kitty</h2>
    <input type="text" inputmode="decimal" id="t-amount" name="transfer-amount" placeholder="Amount" aria-label="Amount">
    <input type="text" id="t-note" name="transfer-note" placeholder="Note (optional)" aria-label="Note">
    <p id="t-msg" class="small error" role="alert"></p>
    <div class="actions">
      <button type="button" id="t-cancel" autofocus>Cancel</button>
      <button type="button" id="t-save" class="primary">Add transfer</button>
    </div>
  </dialog>

  <dialog id="edit-dlg" aria-labelledby="e-title">
    <h2 id="e-title">Edit expense</h2>
    <div class="entry-grid">
      <input type="month" id="e-month" class="l-month" aria-label="Month">
      <button type="button" id="e-type" class="l-type type-btn" data-type="expense" aria-pressed="false" aria-label="Expense or income (tap to switch)">Expense</button>
      <input type="text" inputmode="decimal" id="e-amount" class="l-amount" aria-label="Amount">
      <label class="l-kitty kitty-tick" title="Comes off / adds to Jop's kitty"><input type="checkbox" id="e-kitty" name="kitty"><span>Kitty</span></label>
    </div>
    <select id="e-cat" aria-label="Category"></select>
    <input type="text" id="e-comment" placeholder="Comment / detail" aria-label="Comment">
    <p id="e-msg" class="small error" role="alert"></p>
    <div class="actions">
      <button type="button" id="e-del" class="danger">Delete</button>
      <button type="button" id="e-cancel" autofocus>Cancel</button>
      <button type="button" id="e-save" class="primary">Save</button>
    </div>
  </dialog>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
