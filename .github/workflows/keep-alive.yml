# Keeps the free Supabase project from pausing (it pauses after 7 days with no activity).
# Every 3 days it asks the database for one row with the public key. Anonymous users have no access,
# so Postgres answers "permission denied" (code 42501): that answer proves the database itself was reached.
# Nothing is read or written. A failed run emails the repo owner.
name: Keep Supabase awake

on:
  schedule:
    - cron: '17 3 */3 * *'   # 03:17 UTC every 3rd day
  workflow_dispatch:          # "Run workflow" button for a manual test

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: config.js
          sparse-checkout-cone-mode: false
      - name: Ping the database
        run: |
          url=$(grep -o "SUPABASE_URL: '[^']*'" config.js | cut -d"'" -f2)
          key=$(grep -o "SUPABASE_ANON_KEY: '[^']*'" config.js | cut -d"'" -f2)
          body=$(curl -sS --retry 3 --retry-all-errors --max-time 30 "$url/rest/v1/expenses?select=id&limit=1" -H "apikey: $key")
          echo "$body"
          case "$body" in
            *'"code":"42501"'*|'['*) echo "Database answered - project is awake." ;;
            *) echo "::error::Unexpected answer from Supabase (paused or down?)"; exit 1 ;;
          esac
